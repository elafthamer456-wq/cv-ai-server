<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>AI Assistant</title>
    <style>
        body { background: #f5f5f5; font-family: Arial; padding: 30px; }
        .container { max-width: 700px; margin: auto; background: white; border-radius: 15px; padding: 25px; box-shadow: 0 0 15px rgba(0,0,0,0.1); }
        textarea { width: 100%; height: 130px; padding: 12px; border-radius: 10px; border: 1px solid #ccc; font-size: 16px; }
        button { width: 100%; padding: 12px; margin-top: 10px; background: #6a0dad; color: white; border: none; border-radius: 10px; font-size: 16px; cursor: pointer; }
        #responseBox { margin-top: 25px; background: #fafafa; padding: 20px; border-radius: 10px; white-space: pre-wrap; line-height: 1.6; font-size: 16px; border: 1px solid #eee; }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="text-align:center; color:#6a0dad;">المساعد الذكي للـ CV</h2>
        <p style="text-align:center;">اكتب أي سؤال… تحسين CV، اقتراح مهارات، كتابة Summary أو Achievements</p>

        <textarea id="userInput" placeholder="اكتب طلبك هنا..."></textarea>
        <button onclick="sendToAI()">إرسال للذكاء الاصطناعي</button>

        <div id="responseBox">الرد سيظهر هنا...</div>
    </div>

    <script>
        async function sendToAI() {
            const text = document.getElementById("userInput").value;
            const responseBox = document.getElementById("responseBox");
            responseBox.innerText = "جاري التفكير...";

            try {
                const response = await fetch("/ai", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ prompt: text })
                });

                const data = await response.json();
                responseBox.innerText = data.answer || "لم يتم تلقي رد من السيرفر";
            } catch (err) {
                responseBox.innerText = "حدث خطأ أثناء الاتصال بالسيرفر: " + err.message;
            }
        }
    </script>
</body>
</html>
