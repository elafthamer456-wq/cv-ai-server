<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Chat</title>
<style>
    body {
        margin: 0;
        background: #0e0e0e;
        font-family: Arial, sans-serif;
        color: white;
    }
    h2 {
        text-align: center;
        padding: 15px;
        margin: 0;
        background: #111;
        border-bottom: 1px solid #333;
    }
    #chat-box {
        height: 80vh;
        overflow-y: auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 15px;
    }
    .msg {
        max-width: 70%;
        padding: 12px 15px;
        border-radius: 10px;
        line-height: 1.4;
        white-space: pre-wrap;
    }
    .user {
        align-self: flex-end;
        background: #7b4bff;
        border-bottom-right-radius: 0;
    }
    .ai {
        align-self: flex-start;
        background: #2b2b2b;
        border-bottom-left-radius: 0;
    }
    #input-area {
        display: flex;
        padding: 15px;
        background: #111;
        border-top: 1px solid #333;
        gap: 10px;
    }
    textarea {
        flex: 1;
        padding: 10px;
        border-radius: 8px;
        border: none;
        font-size: 16px;
        resize: none;
        height: 50px;
        background: #222;
        color: white;
    }
    button {
        padding: 10px 20px;
        border: none;
        border-radius: 8px;
        background: #7b4bff;
        color: white;
        cursor: pointer;
        font-size: 16px;
    }
    button:hover {
        background: #6a3ef2;
    }
    .typing {
        font-size: 14px;
        opacity: 0.7;
        margin-left: 5px;
    }
</style>
</head>

<body>
<h2>AI Chat</h2>

<div id="chat-box"></div>

<div id="input-area">
    <textarea id="msg" placeholder="اكتب رسالتك..."></textarea>
    <button onclick="send()">Send</button>
</div>

<script>
const API_URL = "https://cv-ai-server-ny57.onrender.com"; // رابط السيرفر حقك

function addMessage(text, sender) {
    const box = document.getElementById("chat-box");
    const msg = document.createElement("div");
    msg.classList.add("msg", sender);
    msg.innerText = text;
    box.appendChild(msg);
    box.scrollTop = box.scrollHeight;
}

function typeWriterEffect(text, callback) {
    let i = 0;
    let result = "";
    const interval = setInterval(() => {
        result += text[i];
        callback(result);
        i++;
        if (i >= text.length) clearInterval(interval);
    }, 20);
}

async function send() {
    const prompt = document.getElementById("msg").value;
    if (!prompt.trim()) return;

    addMessage(prompt, "user");
    document.getElementById("msg").value = "";

    // Typing indicator
    const typingMsg = document.createElement("div");
    typingMsg.classList.add("msg", "ai");
    typingMsg.innerHTML = "<span class='typing'>AI is typing...</span>";
    document.getElementById("chat-box").appendChild(typingMsg);

    const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: prompt })
    });

    const data = await res.json();
    typingMsg.remove();

    // Write AI message with animation
    const finalMsg = document.createElement("div");
    finalMsg.classList.add("msg", "ai");
    document.getElementById("chat-box").appendChild(finalMsg);

    typeWriterEffect(data.reply, (txt) => {
        finalMsg.innerText = txt;
        document.getElementById("chat-box").scrollTop = document.getElementById("chat-box").scrollHeight;
    });
}
</script>

</body>
</html>
