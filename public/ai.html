<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI CV Assistant</title>

<style>
    body {
        margin: 0;
        background: #f2f0f7;
        font-family: "Arial", sans-serif;
    }

    .chat-container {
        max-width: 850px;
        margin: 50px auto;
        background: #ffffff;
        border-radius: 20px;
        padding: 25px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    }

    .header {
        text-align: center;
        font-size: 26px;
        color: #6a0dad;
        font-weight: bold;
        margin-bottom: 5px;
    }

    .subtext {
        text-align: center;
        font-size: 15px;
        color: #444;
        margin-bottom: 20px;
    }

    .chat-box {
        height: 420px;
        overflow-y: auto;
        padding: 15px;
        border-radius: 15px;
        background: #faf8ff;
        border: 1px solid #e5d9fa;
    }

    .msg {
        max-width: 75%;
        padding: 12px 16px;
        border-radius: 16px;
        margin-bottom: 12px;
        font-size: 16px;
        line-height: 1.6;
        white-space: pre-wrap;
    }

    .user {
        background: #6a0dad;
        color: white;
        margin-left: auto;
        border-bottom-right-radius: 0;
    }

    .ai {
        background: #ece3ff;
        color: #3a2b4a;
        margin-right: auto;
        border-bottom-left-radius: 0;
    }

    .input-area {
        display: flex;
        margin-top: 15px;
        gap: 10px;
    }

    textarea {
        flex: 1;
        height: 80px;
        border-radius: 12px;
        padding: 12px;
        border: 1px solid #c3b1e6;
        font-size: 16px;
    }

    button {
        width: 120px;
        background: #6a0dad;
        border: none;
        color: white;
        border-radius: 12px;
        font-size: 17px;
        cursor: pointer;
        padding: 10px;
        transition: 0.25s;
    }

    button:hover {
        background: #580aaf;
    }
</style>
</head>

<body>

<div class="chat-container">
    <div class="header">AI CV Assistant</div>
    <div class="subtext">Ask anything — CV improvement, skills, summaries, achievements…</div>

    <div class="chat-box" id="chatBox"></div>

    <div class="input-area">
        <textarea id="userInput" placeholder="Write your message..."></textarea>
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    const chatBox = document.getElementById("chatBox");

    function addMessage(text, type) {
        const msg = document.createElement("div");
        msg.className = "msg " + type;
        msg.innerText = text;
        chatBox.appendChild(msg);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function sendMessage() {
        const text = document.getElementById("userInput").value.trim();
        if (!text) return;

        addMessage(text, "user");
        document.getElementById("userInput").value = "";

        addMessage("Thinking...", "ai");

        try {
            const response = await fetch("/ai", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ prompt: text })
            });

            const data = await response.json();

            chatBox.removeChild(chatBox.lastChild); // remove "Thinking..."

            addMessage(data.answer || "No response from server.", "ai");

        } catch (err) {
            chatBox.removeChild(chatBox.lastChild);
            addMessage("⚠️ Connection error.", "ai");
            console.error(err);
        }
    }
</script>

</body>
</html>
